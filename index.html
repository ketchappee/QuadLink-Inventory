<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUADLINK INVENTORY</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            /* Premium Cafe Background Image */
            background-image: url('https://images.unsplash.com/photo-1497935586351-b67a49e012bf?q=80&w=3000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Dark overlay to make glass components readable */
        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(30, 25, 20, 0.6);
            z-index: -1;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.1);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateZ(0);
            will-change: transform, background-color, border-color, box-shadow;
            backface-visibility: hidden;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translate3d(0, -6px, 0) scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 12px 24px 0 rgba(0, 0, 0, 0.15);
        }

        .glass-card.active {
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transform: translate3d(0, -4px, 0);
            box-shadow: 0 12px 24px 0 rgba(0, 0, 0, 0.15);
        }
        
        .glass-card.active h3 { color: #1c1917; }
        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Text Shimmer Animation */
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .animate-shimmer {
            background-size: 200% auto;
            animation: shimmer 4s linear infinite;
        }

        /* Mac-like Magnification Hover (144Hz Smooth) */
        .mac-hover {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, box-shadow;
            transform: translate3d(0, 0, 0);
        }
        .mac-hover:hover {
            transform: translate3d(0, -4px, 0) scale(1.08);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }

        /* Custom Checkbox */
        .custom-checkbox {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 0.375rem;
            background-color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.2s;
            display: grid;
            place-content: center;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.65rem;
            height: 0.65rem;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #1c1917;
            background-color: #1c1917;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked {
            background-color: rgba(255, 255, 255, 0.9);
            border-color: white;
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        /* Responsive Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.5); }
    </style>
</head>
<body class="text-stone-100 h-screen w-screen overflow-hidden relative selection:bg-stone-200 selection:text-stone-900">
    
    <div class="bg-overlay"></div>

    <!-- ==================== LANDING PAGE ==================== -->
    <div id="landing-page" class="absolute inset-0 z-50 flex flex-col items-center justify-center transition-all duration-700 ease-in-out">
        <div class="glass-panel p-8 sm:p-12 md:p-20 rounded-[2rem] md:rounded-[3rem] flex flex-col items-center text-center space-y-6 md:space-y-8 slide-up w-[90%] max-w-3xl">
            <div class="space-y-3 md:space-y-4">
                <p class="text-stone-300 uppercase tracking-[0.3em] md:tracking-[0.4em] text-xs md:text-sm font-bold">Welcome to</p>
                <h1 class="text-4xl sm:text-5xl md:text-7xl font-extrabold text-white tracking-tight flex flex-col gap-1 md:gap-2">
                    <span>QUADLINK</span>
                    <span class="text-2xl sm:text-3xl md:text-5xl font-light text-stone-300">INVENTORY</span>
                </h1>
            </div>
            <button onclick="proceedToHome()" class="smooth-gpu group relative flex items-center justify-center gap-3 bg-white text-stone-900 px-6 md:px-8 py-3 md:py-4 rounded-full font-bold text-sm md:text-base hover:bg-stone-200 overflow-hidden mt-2 md:mt-4">
                <span>Enter System</span>
                <i data-lucide="arrow-right" class="w-4 h-4 md:w-5 md:h-5 transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] group-hover:translate-x-1.5"></i>
            </button>
        </div>
    </div>

    <!-- ==================== HOME PAGE ==================== -->
    <div id="home-page" class="absolute inset-0 z-40 opacity-0 pointer-events-none transition-opacity duration-700 ease-in-out flex flex-col h-full overflow-y-auto">
        
        <!-- Header -->
        <header class="px-4 sm:px-6 md:px-8 py-4 flex justify-between items-center glass-panel sticky top-0 z-30 border-x-0 border-t-0 rounded-none bg-white/10">
            <div class="flex items-center gap-3 md:gap-4">
                <button onclick="returnToLanding()" class="w-10 h-10 md:w-12 md:h-12 bg-white/90 rounded-xl md:rounded-2xl flex items-center justify-center shadow-lg mac-hover border-none outline-none cursor-pointer group">
                    <img src="quadlogo_3.ico" alt="Logo" class="w-6 h-6 md:w-8 md:h-8 object-contain transition-transform duration-300">
                </button>
                <h2 class="text-xl md:text-2xl font-bold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-stone-400 to-white animate-shimmer hidden sm:block whitespace-nowrap">QUADLINK CAFE INVENTORY</h2>
            </div>
            
            <div class="flex items-center gap-2 px-4 py-2 glass-panel rounded-full text-xs md:text-sm font-semibold text-white bg-white/5">
                <i data-lucide="calendar" class="w-3 h-3 md:w-4 md:h-4"></i>
                <span id="current-date"></span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 py-6 md:py-8 w-full space-y-6 md:space-y-8 flex-grow pb-24">
            
            <!-- Navigation Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
                <!-- In House Tab -->
                <button onclick="switchTab('in-house')" id="tab-in-house" class="glass-card active p-5 md:p-6 rounded-2xl md:rounded-3xl text-left flex flex-col cursor-pointer group">
                    <div class="flex justify-between items-start mb-4 md:mb-6 w-full">
                        <div class="icon-container p-3 rounded-xl md:rounded-2xl bg-white/20 text-white transition-colors duration-300">
                            <i data-lucide="coffee" class="w-6 h-6 md:w-7 md:h-7"></i>
                        </div>
                        <span id="count-in-house" class="text-[10px] md:text-xs font-bold px-2.5 py-1 rounded-full bg-stone-900/40 text-white backdrop-blur-md border border-white/20">0 Items</span>
                    </div>
                    <h3 class="text-lg md:text-xl font-bold tracking-tight text-white">In House</h3>
                    <p class="mt-1 md:mt-2 text-xs md:text-sm text-stone-300 font-medium">Daily active stock.</p>
                </button>

                <!-- Storage Tab -->
                <button onclick="switchTab('storage')" id="tab-storage" class="glass-card p-5 md:p-6 rounded-2xl md:rounded-3xl text-left flex flex-col cursor-pointer group">
                    <div class="flex justify-between items-start mb-4 md:mb-6 w-full">
                        <div class="icon-container p-3 rounded-xl md:rounded-2xl bg-white/20 text-white transition-colors duration-300">
                            <i data-lucide="package" class="w-6 h-6 md:w-7 md:h-7"></i>
                        </div>
                        <span id="count-storage" class="text-[10px] md:text-xs font-bold px-2.5 py-1 rounded-full bg-stone-900/40 text-white backdrop-blur-md border border-white/20">0 Items</span>
                    </div>
                    <h3 class="text-lg md:text-xl font-bold tracking-tight text-white">Storage</h3>
                    <p class="mt-1 md:mt-2 text-xs md:text-sm text-stone-300 font-medium">Track bulk supplies.</p>
                </button>

                <!-- Marked Out Tab -->
                <button onclick="switchTab('marked-out')" id="tab-marked-out" class="glass-card p-5 md:p-6 rounded-2xl md:rounded-3xl text-left flex flex-col cursor-pointer group sm:col-span-2 md:col-span-1">
                    <div class="flex justify-between items-start mb-4 md:mb-6 w-full">
                        <div class="icon-container p-3 rounded-xl md:rounded-2xl bg-white/20 text-white transition-colors duration-300">
                            <i data-lucide="archive-x" class="w-6 h-6 md:w-7 md:h-7"></i>
                        </div>
                        <span id="count-marked-out" class="text-[10px] md:text-xs font-bold px-2.5 py-1 rounded-full bg-stone-900/40 text-white backdrop-blur-md border border-white/20">0 Items</span>
                    </div>
                    <h3 class="text-lg md:text-xl font-bold tracking-tight text-white">Marked Out</h3>
                    <p class="mt-1 md:mt-2 text-xs md:text-sm text-stone-300 font-medium">Review waste & damage.</p>
                </button>
            </div>

            <!-- Action Bar -->
            <div class="glass-panel p-3 md:p-4 rounded-xl md:rounded-2xl flex flex-col lg:flex-row justify-between items-center gap-3 md:gap-4 fade-in">
                <div class="flex items-center gap-2 md:gap-3 w-full lg:w-auto flex-wrap sm:flex-nowrap">
                    <button onclick="deleteSelected()" id="btn-delete" class="smooth-gpu flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 md:px-4 py-2 md:py-2.5 bg-red-500/80 hover:bg-red-500 text-white rounded-lg md:rounded-xl font-semibold text-xs md:text-sm disabled:opacity-40 disabled:cursor-not-allowed shadow-lg" disabled>
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Delete Selected</span>
                        <span class="sm:hidden">Delete</span>
                        <span id="selected-count" class="bg-white text-red-600 text-[10px] md:text-xs px-1.5 md:px-2 py-0.5 rounded-full hidden">0</span>
                    </button>
                    <button onclick="clearHistory()" class="smooth-gpu flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 md:px-4 py-2 md:py-2.5 bg-white/10 hover:bg-white/20 text-white border border-white/20 rounded-lg md:rounded-xl font-semibold text-xs md:text-sm">
                        <i data-lucide="history" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Clear History</span>
                        <span class="sm:hidden">Clear</span>
                    </button>
                    <button onclick="exportToExcel()" class="smooth-gpu flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 md:px-4 py-2 md:py-2.5 bg-emerald-500/80 hover:bg-emerald-500 text-white rounded-lg md:rounded-xl font-semibold text-xs md:text-sm shadow-lg">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">Export to Excel</span>
                        <span class="sm:hidden">Export</span>
                    </button>
                </div>
                
                <button onclick="openAddModal()" class="smooth-gpu w-full lg:w-auto flex items-center justify-center gap-2 bg-white hover:bg-stone-200 text-stone-900 px-6 py-3 md:py-2.5 rounded-xl font-bold text-sm whitespace-nowrap">
                    <i data-lucide="plus" class="w-4 h-4 md:w-5 md:h-5"></i>
                    <span id="add-btn-text">Add Item</span>
                </button>
            </div>

            <!-- Dynamic Table Section -->
            <section class="glass-panel rounded-2xl md:rounded-3xl overflow-hidden fade-in shadow-2xl flex flex-col bg-white/10">
                <!-- Table Toolbar -->
                <div class="p-4 md:p-5 border-b border-white/20 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <h2 id="section-title" class="text-lg md:text-xl font-bold text-white tracking-tight">In House Inventory</h2>
                    <div class="relative w-full sm:w-auto">
                        <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-stone-300 w-4 h-4"></i>
                        <input type="text" id="search-input" onkeyup="renderTable()" placeholder="Search items..." class="w-full sm:w-56 md:w-64 pl-9 pr-4 py-2 bg-black/20 border border-white/20 rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-white/50 text-white placeholder-stone-300 transition-all">
                    </div>
                </div>
                
                <!-- Table Content -->
                <div class="overflow-x-auto w-full transition-opacity duration-300 min-h-[300px]" id="table-container">
                    <table class="w-full text-left border-collapse min-w-[650px]">
                        <thead class="bg-black/30 border-b border-white/20" id="table-head">
                            <!-- Dynamically populated -->
                        </thead>
                        <tbody class="divide-y divide-white/10" id="table-body">
                            <!-- Dynamically populated -->
                        </tbody>
                    </table>
                    
                    <!-- Empty State -->
                    <div id="empty-state" class="hidden flex-col items-center justify-center py-16 md:py-24 text-stone-300">
                        <i data-lucide="inbox" class="w-12 h-12 md:w-16 md:h-16 mb-3 md:mb-4 opacity-50"></i>
                        <p class="font-bold text-base md:text-lg text-white">No items found</p>
                        <p class="text-xs md:text-sm mt-1">Click 'Add Item' to populate this section.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- ==================== ADD ITEM MODAL ==================== -->
    <div id="add-modal" class="fixed inset-0 z-[60] bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="glass-panel bg-stone-900/80 rounded-3xl shadow-2xl w-full max-w-md p-6 md:p-8 transform translate-y-8 transition-transform duration-300 scale-95 border border-white/20" id="add-modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-white" id="modal-title">Add Item</h3>
                <button onclick="closeAddModal()" class="text-stone-400 hover:text-white transition-all duration-300 ease-out hover:scale-125 hover:rotate-90 origin-center p-2 rounded-full hover:bg-white/10">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="add-form" onsubmit="handleAddItem(event)" class="space-y-4 md:space-y-5">
                <div>
                    <label class="block text-xs md:text-sm font-semibold text-stone-300 mb-1.5">Item Name</label>
                    <input type="text" id="input-name" required placeholder="e.g. Espresso Beans" class="glass-input w-full px-4 py-2.5 rounded-xl text-stone-900 text-sm font-medium shadow-inner placeholder-stone-500">
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label id="label-category" class="block text-xs md:text-sm font-semibold text-stone-300 mb-1.5">Category</label>
                        <select id="input-category" required class="glass-input w-full px-4 py-2.5 rounded-xl text-stone-900 text-sm font-medium shadow-inner appearance-none cursor-pointer">
                            <option value="" disabled selected>Select...</option>
                            <option value="Coffee">Coffee</option>
                            <option value="Milk">Milk / Dairy</option>
                            <option value="Cups">Cups</option>
                            <option value="Syrups">Syrups</option>
                            <option value="Pastry">Pastry</option>
                            <option value="Straw">Straws</option>
                            <option value="Packaging">Packaging</option>
                            <option value="Etc.">Etc.</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs md:text-sm font-semibold text-stone-300 mb-1.5">Date Added</label>
                        <input type="date" id="input-date" required class="glass-input w-full px-4 py-2.5 rounded-xl text-stone-900 text-sm font-medium shadow-inner">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs md:text-sm font-semibold text-stone-300 mb-1.5">Quantity</label>
                        <input type="number" step="0.01" id="input-quantity" required placeholder="0" class="glass-input w-full px-4 py-2.5 rounded-xl text-stone-900 text-sm font-medium shadow-inner">
                    </div>
                    <div>
                        <label class="block text-xs md:text-sm font-semibold text-stone-300 mb-1.5">Unit</label>
                        <select id="input-unit" required class="glass-input w-full px-4 py-2.5 rounded-xl text-stone-900 text-sm font-medium shadow-inner appearance-none cursor-pointer">
                            <option value="" disabled selected>Select...</option>
                            <option value="KG">KG</option>
                            <option value="PACKS">PACKS</option>
                            <option value="PCS">PCS</option>
                            <option value="ML">ML</option>
                            <option value="L">L</option>
                            <option value="BOTTLES">BOTTLES</option>
                            <option value="BOXES">BOXES</option>
                            <option value="Etc.">Etc.</option>
                        </select>
                    </div>
                </div>
                
                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closeAddModal()" class="flex-1 px-4 py-3 bg-white/10 border border-white/20 text-white rounded-xl font-bold hover:bg-white/20 transition-colors text-sm md:text-base">Cancel</button>
                    <button type="submit" class="flex-1 px-4 py-3 bg-white text-stone-900 rounded-xl font-bold hover:bg-stone-200 transition-colors shadow-lg text-sm md:text-base">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================== CONFIRM MODAL ==================== -->
    <div id="confirm-modal" class="fixed inset-0 z-[70] bg-black/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="glass-panel bg-stone-900/95 rounded-3xl shadow-2xl w-full max-w-sm p-6 md:p-8 transform translate-y-8 transition-transform duration-300 scale-95 border border-white/20" id="confirm-modal-content">
            <h3 class="text-xl font-bold text-white mb-2">Confirm Action</h3>
            <p id="confirm-message" class="text-stone-300 text-sm mb-6 font-medium">Are you sure?</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 px-4 py-3 bg-white/10 border border-white/20 text-white rounded-xl font-bold hover:bg-white/20 transition-colors text-sm">Cancel</button>
                <button id="confirm-action-btn" class="flex-1 px-4 py-3 bg-red-500/80 text-white rounded-xl font-bold hover:bg-red-500 transition-colors shadow-lg text-sm">Yes, Delete</button>
            </div>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT LOGIC ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- FIREBASE CONFIGURATION ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'quadlink-inventory-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        let auth, db, userId, itemsCollection;
        
        // --- GLOBAL APP STATE ---
        window.appState = {
            'in-house': [],
            'storage': [],
            'marked-out': []
        };
        window.currentTab = 'in-house';
        window.selectedIds = new Set(); 
        
        const generateID = () => crypto.randomUUID();
        const getTodayStr = () => new Date().toISOString().split('T')[0];

        // --- INIT FIREBASE ---
        if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            initFirebase();
        } else {
            console.warn("No Firebase config detected. Running in memory-only mode.");
        }

        async function initFirebase() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                if (!auth.currentUser) return;
                userId = auth.currentUser.uid;
                
                // Set up collection reference specifically for this user/app (Rule 1 Strict Paths)
                itemsCollection = collection(db, 'artifacts', appId, 'users', userId, 'inventory_items');

                // Real-time listener for database sync
                onSnapshot(itemsCollection, (snapshot) => {
                    const newData = { 'in-house': [], 'storage': [], 'marked-out': [] };
                    
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        if (newData[data.tab]) {
                            newData[data.tab].push({ _id: docSnap.id, ...data });
                        }
                    });

                    // Sort items by date (newest first)
                    for (let key in newData) {
                        newData[key].sort((a, b) => new Date(b.date) - new Date(a.date));
                    }

                    window.appState = newData;
                    window.updateTabCounts();
                    window.renderTable();
                }, (error) => {
                    console.error("Firestore sync error:", error);
                });
            } catch (e) {
                console.error("Firebase auth/init error:", e);
            }
        }

        // --- INIT UI ---
        document.addEventListener('DOMContentLoaded', () => {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', options);
            document.getElementById('input-date').value = getTodayStr();

            window.updateTabCounts();
            window.renderTable();
            lucide.createIcons();
        });

        // --- NAVIGATION & TABS ---
        window.proceedToHome = function() {
            const landingPage = document.getElementById('landing-page');
            const homePage = document.getElementById('home-page');
            landingPage.style.opacity = '0';
            landingPage.style.pointerEvents = 'none';
            setTimeout(() => {
                landingPage.style.display = 'none';
                homePage.classList.remove('opacity-0', 'pointer-events-none');
                homePage.classList.add('opacity-100');
            }, 600);
        }

        window.switchTab = function(tabId) {
            if (window.currentTab === tabId) return;
            window.currentTab = tabId;
            window.selectedIds.clear(); 
            window.updateDeleteButtonState();
            document.getElementById('search-input').value = '';
            
            const tabs = ['in-house', 'storage', 'marked-out'];
            tabs.forEach(t => {
                const card = document.getElementById(`tab-${t}`);
                if (t === tabId) card.classList.add('active');
                else card.classList.remove('active');
            });

            const tableContainer = document.getElementById('table-container');
            tableContainer.style.opacity = '0';
            
            setTimeout(() => {
                window.renderTable();
                tableContainer.style.opacity = '1';
            }, 200);
        }

        window.updateTabCounts = function() {
            document.getElementById('count-in-house').textContent = `${window.appState['in-house'].length} Items`;
            document.getElementById('count-storage').textContent = `${window.appState['storage'].length} Items`;
            document.getElementById('count-marked-out').textContent = `${window.appState['marked-out'].length} Items`;
        }

        // --- TABLE RENDERING ---
        window.renderTable = function() {
            const searchQ = document.getElementById('search-input').value.toLowerCase();
            const rawData = window.appState[window.currentTab];
            
            const data = rawData.filter(item => 
                item.name.toLowerCase().includes(searchQ) || 
                item.category.toLowerCase().includes(searchQ)
            );
            
            const titles = {
                'in-house': 'In House Inventory',
                'storage': 'Storage Inventory',
                'marked-out': 'Marked Out Items'
            };
            document.getElementById('section-title').textContent = titles[window.currentTab];
            
            const tableHead = document.getElementById('table-head');
            const tableBody = document.getElementById('table-body');
            const emptyState = document.getElementById('empty-state');
            const tableElement = document.querySelector('table');

            if (data.length === 0) {
                tableElement.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                tableElement.classList.remove('hidden');
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                const allSelected = data.length > 0 && data.every(item => window.selectedIds.has(item._id));

                tableHead.innerHTML = `
                    <tr>
                        <th class="px-4 md:px-6 py-4 w-12">
                            <input type="checkbox" class="custom-checkbox" onchange="toggleSelectAll(this, ${JSON.stringify(data.map(d=>d._id)).replace(/"/g, "'")})" ${allSelected ? 'checked' : ''}>
                        </th>
                        <th class="px-4 md:px-6 py-4 text-xs md:text-sm uppercase tracking-widest text-stone-300 font-bold whitespace-nowrap">Item Name</th>
                        <th class="px-4 md:px-6 py-4 text-xs md:text-sm uppercase tracking-widest text-stone-300 font-bold whitespace-nowrap">Category</th>
                        <th class="px-4 md:px-6 py-4 text-xs md:text-sm uppercase tracking-widest text-stone-300 font-bold whitespace-nowrap">Quantity</th>
                        <th class="px-4 md:px-6 py-4 text-xs md:text-sm uppercase tracking-widest text-stone-300 font-bold whitespace-nowrap">Unit</th>
                        <th class="px-4 md:px-6 py-4 text-xs md:text-sm uppercase tracking-widest text-stone-300 font-bold whitespace-nowrap">Date</th>
                    </tr>
                `;

                let bodyHTML = '';
                data.forEach(row => {
                    const isChecked = window.selectedIds.has(row._id);
                    bodyHTML += `
                        <tr class="hover:bg-white/10 transition-colors duration-200 ${isChecked ? 'bg-white/20' : ''}">
                            <td class="px-4 md:px-6 py-4">
                                <input type="checkbox" class="custom-checkbox row-checkbox" value="${row._id}" onchange="toggleSelectRow('${row._id}')" ${isChecked ? 'checked' : ''}>
                            </td>
                            <td class="px-4 md:px-6 py-4 text-sm font-bold text-white whitespace-nowrap">${row.name}</td>
                            <td class="px-4 md:px-6 py-4 text-sm font-medium text-stone-300 whitespace-nowrap">
                                <span class="bg-black/30 px-2.5 py-1 rounded-md border border-white/10">${row.category}</span>
                            </td>
                            <td class="px-4 md:px-6 py-4 text-sm font-bold text-white whitespace-nowrap">${row.quantity}</td>
                            <td class="px-4 md:px-6 py-4 text-sm font-medium text-stone-300 whitespace-nowrap">${row.unit}</td>
                            <td class="px-4 md:px-6 py-4 text-sm font-medium text-stone-300 whitespace-nowrap">${row.date}</td>
                        </tr>
                    `;
                });
                tableBody.innerHTML = bodyHTML;
            }
            window.updateTabCounts();
        }

        // --- SELECTION LOGIC ---
        window.toggleSelectAll = function(checkbox, currentDataIdsStr) {
            const currentDataIds = JSON.parse(currentDataIdsStr.replace(/'/g, '"'));
            if (checkbox.checked) {
                currentDataIds.forEach(id => window.selectedIds.add(id));
            } else {
                currentDataIds.forEach(id => window.selectedIds.delete(id));
            }
            window.renderTable(); 
            window.updateDeleteButtonState();
        }

        window.toggleSelectRow = function(id) {
            if (window.selectedIds.has(id)) window.selectedIds.delete(id);
            else window.selectedIds.add(id);
            
            window.updateDeleteButtonState();
            
            const rowCheckboxes = document.querySelectorAll('.row-checkbox');
            let allChecked = true;
            rowCheckboxes.forEach(cb => {
                const tr = cb.closest('tr');
                if (cb.checked) {
                    tr.classList.add('bg-white/20');
                } else {
                    tr.classList.remove('bg-white/20');
                    allChecked = false;
                }
            });
            const headerCheckbox = document.querySelector('#table-head input[type="checkbox"]');
            if (headerCheckbox) headerCheckbox.checked = allChecked && rowCheckboxes.length > 0;
        }

        window.updateDeleteButtonState = function() {
            const btn = document.getElementById('btn-delete');
            const badge = document.getElementById('selected-count');
            if (window.selectedIds.size > 0) {
                btn.disabled = false;
                badge.textContent = window.selectedIds.size;
                badge.classList.remove('hidden');
            } else {
                btn.disabled = true;
                badge.classList.add('hidden');
            }
        }

        // --- CONFIRM MODAL CONTROLS ---
        window.showConfirmModal = function(message, onConfirm) {
            document.getElementById('confirm-message').textContent = message;
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('translate-y-8', 'scale-95');
            content.classList.add('translate-y-0', 'scale-100');

            const btn = document.getElementById('confirm-action-btn');
            btn.onclick = () => {
                onConfirm();
                window.closeConfirmModal();
            };
        }

        window.closeConfirmModal = function() {
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            content.classList.remove('translate-y-0', 'scale-100');
            content.classList.add('translate-y-8', 'scale-95');
            setTimeout(() => {
                modal.classList.add('opacity-0', 'pointer-events-none');
            }, 300);
        }

        // --- ACTIONS & DATABASE SYNC ---
        window.deleteSelected = async function() {
            if (window.selectedIds.size === 0) return;
            
            window.showConfirmModal(`Permanently delete ${window.selectedIds.size} selected item(s)?`, async () => {
                if (userId && itemsCollection) {
                    try {
                        const batch = writeBatch(db);
                        window.selectedIds.forEach(id => {
                            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'inventory_items', id);
                            batch.delete(docRef);
                        });
                        await batch.commit();
                        window.selectedIds.clear();
                        window.updateDeleteButtonState();
                    } catch (e) {
                        console.error("Error deleting from Firebase:", e);
                    }
                } else {
                    // Fallback to local memory deletion if not connected
                    window.appState[window.currentTab] = window.appState[window.currentTab].filter(item => !window.selectedIds.has(item._id));
                    window.selectedIds.clear();
                    window.updateDeleteButtonState();
                    window.renderTable();
                }
            });
        }

        window.clearHistory = async function() {
            if (window.appState[window.currentTab].length === 0) return;
            
            const tabName = window.currentTab.replace('-', ' ').toUpperCase();
            window.showConfirmModal(`Clear ALL items in ${tabName}? This action cannot be undone.`, async () => {
                if (userId && itemsCollection) {
                    try {
                        const batch = writeBatch(db);
                        window.appState[window.currentTab].forEach(item => {
                            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'inventory_items', item._id);
                            batch.delete(docRef);
                        });
                        await batch.commit();
                        window.selectedIds.clear();
                        window.updateDeleteButtonState();
                    } catch (e) {
                        console.error("Error clearing Firebase collection:", e);
                    }
                } else {
                    // Fallback local memory clearing
                    window.appState[window.currentTab] = [];
                    window.selectedIds.clear();
                    window.updateDeleteButtonState();
                    window.renderTable();
                }
            });
        }

        // --- ADD ITEM LOGIC & MODAL ---
        window.openAddModal = function() {
            const modal = document.getElementById('add-modal');
            const content = document.getElementById('add-modal-content');
            document.getElementById('add-form').reset();
            document.getElementById('input-date').value = getTodayStr(); 
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('translate-y-8', 'scale-95');
            content.classList.add('translate-y-0', 'scale-100');
        }

        window.closeAddModal = function() {
            const modal = document.getElementById('add-modal');
            const content = document.getElementById('add-modal-content');
            content.classList.remove('translate-y-0', 'scale-100');
            content.classList.add('translate-y-8', 'scale-95');
            setTimeout(() => {
                modal.classList.add('opacity-0', 'pointer-events-none');
            }, 300);
        }

        window.handleAddItem = async function(event) {
            event.preventDefault();
            const newItem = {
                name: document.getElementById('input-name').value,
                category: document.getElementById('input-category').value,
                quantity: parseFloat(document.getElementById('input-quantity').value) || 0,
                unit: document.getElementById('input-unit').value,
                date: document.getElementById('input-date').value,
                tab: window.currentTab // Map this item to current section tab
            };

            if (userId && itemsCollection) {
                try {
                    // Add directly to Firebase; the real-time listener will instantly refresh the table!
                    const docRef = doc(itemsCollection);
                    await setDoc(docRef, newItem);
                    window.closeAddModal();
                } catch (e) {
                    console.error("Error adding to Firebase:", e);
                }
            } else {
                // Fallback to local memory saving
                newItem._id = generateID();
                window.appState[window.currentTab].unshift(newItem); 
                window.closeAddModal();
                setTimeout(() => window.renderTable(), 300);
            }
        }

        // --- EXPORT TO EXCEL ---
        window.exportToExcel = function() {
            const mergedMap = new Map();

            const processItem = (item, source) => {
                const key = item.name.toLowerCase().trim();
                if (!mergedMap.has(key)) {
                    mergedMap.set(key, {
                        desc: item.name,
                        unit: item.unit, 
                        inHouse: 0,
                        storage: 0
                    });
                }
                const record = mergedMap.get(key);
                if (source === 'in-house') record.inHouse += item.quantity;
                if (source === 'storage') record.storage += item.quantity;
            };

            window.appState['in-house'].forEach(item => processItem(item, 'in-house'));
            window.appState['storage'].forEach(item => processItem(item, 'storage'));

            const today = new Date();
            const dateStr = today.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

            const wsData = [
                [`Date: ${dateStr}`, "CAFÉ INVENTORY ( QUADLINK )"],
                ["Organized by product categories with In-House and Storage breakdown"], 
                [], 
                ["Item Description", "Unit", "In-House Bar", "Back Storage", "Total On-Hand", "Stock Status"] 
            ];

            mergedMap.forEach(row => {
                const total = row.inHouse + row.storage;
                const status = total > 0 ? 'OK' : 'EMPTY';
                wsData.push([
                    row.desc,
                    row.unit,
                    row.inHouse,
                    row.storage,
                    total,
                    status
                ]);
            });

            const ws = XLSX.utils.aoa_to_sheet(wsData);
            ws['!cols'] = [ {wch: 30}, {wch: 10}, {wch: 15}, {wch: 15}, {wch: 15}, {wch: 15} ];

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventory");

            const formattedDate = `${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}-${String(today.getFullYear()).slice(-2)}`;
            const fileName = `${formattedDate} ( INVENTORY ).xlsx`;

            XLSX.writeFile(wb, fileName);
        }
    </script>
</body>
</html>
