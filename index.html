<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUADLINK INVENTORY</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            background-image: url('https://images.unsplash.com/photo-1497935586351-b67a49e012bf?q=80&w=3000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 15, 10, 0.75);
            z-index: -1;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: rgba(30, 25, 20, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        
        /* Ultra Smooth Glass Cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 16px 0 rgba(0, 0, 0, 0.15);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
            transform: scale(1) translateZ(0);
            will-change: transform, background-color, border-color, box-shadow;
            backface-visibility: hidden;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(1.03) translateY(-4px);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow: 0 16px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* Active Glass Card with High-Contrast Dark Icons */
        .glass-card.active {
            background: rgba(255, 255, 255, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.95);
            transform: scale(1.02) translateY(-2px);
            box-shadow: 0 16px 32px 0 rgba(0, 0, 0, 0.25);
        }
        
        .glass-card.active h3 { color: #1c1917; }
        .glass-card.active p { color: #44403c !important; }
        .glass-card.active span { color: #292524 !important; background: rgba(0,0,0,0.08) !important; border-color: rgba(0,0,0,0.15) !important; }
        .glass-card.active .icon-container { background: rgba(0, 0, 0, 0.08) !important; color: #1c1917 !important; }
        .glass-card.active .logo-icon { color: #1c1917 !important; stroke: #1c1917 !important; }

        /* Smooth Wiggle Animation for Logo Icons on Hover */
        @keyframes smoothWiggle {
            0% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-10deg) scale(1.12); }
            50% { transform: rotate(8deg) scale(1.12); }
            75% { transform: rotate(-6deg) scale(1.12); }
            100% { transform: rotate(0deg) scale(1.08); }
        }

        .glass-card:hover .logo-icon {
            animation: smoothWiggle 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .logo-icon {
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.3s ease;
            transform-origin: center;
        }

        .fade-in { animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .slide-up { animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes rowFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .row-animate {
            animation: rowFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .animate-shimmer {
            background-size: 200% auto;
            animation: shimmer 4s linear infinite;
        }

        .mac-hover {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, box-shadow;
            transform: translate3d(0, 0, 0);
        }
        .mac-hover:hover {
            transform: translate3d(0, -4px, 0) scale(1.06);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }

        .custom-checkbox {
            appearance: none;
            width: 1.25rem;
            height: 1.25rem;
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 0.375rem;
            background-color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: grid;
            place-content: center;
        }
        .custom-checkbox::before {
            content: "";
            width: 0.65rem;
            height: 0.65rem;
            transform: scale(0);
            transition: 180ms transform cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 1em 1em #1c1917;
            background-color: #1c1917;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }
        .custom-checkbox:checked {
            background-color: rgba(255, 255, 255, 0.95);
            border-color: white;
        }
        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.4); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.6); }
    </style>
</head>
<body class="text-white h-screen w-screen overflow-hidden relative selection:bg-stone-200 selection:text-stone-900">
    
    <div class="bg-overlay"></div>

    <!-- Toast Notification Banner -->
    <div id="toast-notification" class="fixed top-5 right-5 z-[110] transform translate-y-[-150%] opacity-0 transition-all duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] glass-panel bg-stone-900/90 border border-white/30 px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3">
        <i id="toast-icon" data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>
        <span id="toast-message" class="text-sm font-bold text-white">Action successful</span>
    </div>

    <!-- ==================== LANDING PAGE ==================== -->
    <div id="landing-page" class="absolute inset-0 z-50 flex flex-col items-center justify-center transition-all duration-700 ease-in-out">
        <div class="glass-panel p-8 sm:p-12 md:p-20 rounded-[2rem] md:rounded-[3rem] flex flex-col items-center text-center space-y-6 md:space-y-8 slide-up w-[90%] max-w-3xl">
            <div class="space-y-3 md:space-y-4">
                <p class="text-stone-200 uppercase tracking-[0.3em] md:tracking-[0.4em] text-xs md:text-sm font-bold">Welcome to</p>
                <h1 class="text-4xl sm:text-5xl md:text-7xl font-extrabold text-white tracking-tight flex flex-col gap-1 md:gap-2 drop-shadow-md">
                    <span>QUADLINK</span>
                    <span class="text-2xl sm:text-3xl md:text-5xl font-light text-stone-200">INVENTORY</span>
                </h1>
            </div>
            <button onclick="proceedToHome()" class="group relative flex items-center justify-center gap-3 bg-white text-stone-900 px-6 md:px-8 py-3 md:py-4 rounded-full font-bold text-sm md:text-base hover:bg-stone-100 shadow-xl overflow-hidden mt-2 md:mt-4 transition-all duration-300 hover:scale-105 active:scale-95">
                <span>Enter System</span>
                <i data-lucide="arrow-right" class="w-4 h-4 md:w-5 md:h-5 transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] group-hover:translate-x-1.5"></i>
            </button>
        </div>
    </div>

    <!-- ==================== HOME PAGE ==================== -->
    <div id="home-page" class="absolute inset-0 z-40 opacity-0 pointer-events-none transition-opacity duration-700 ease-in-out flex flex-col h-full overflow-y-auto">
        
        <!-- Header -->
        <header class="px-4 sm:px-6 md:px-8 py-4 flex justify-between items-center glass-panel sticky top-0 z-30 border-x-0 border-t-0 rounded-none bg-stone-900/40">
            <div class="flex items-center gap-3 md:gap-4">
                <button onclick="returnToLanding()" class="w-10 h-10 md:w-12 md:h-12 bg-white/95 rounded-xl md:rounded-2xl flex items-center justify-center shadow-lg mac-hover border-none outline-none cursor-pointer group">
                    <img src="quadlogo_3.ico" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" alt="Logo" class="w-6 h-6 md:w-8 md:h-8 object-contain transition-transform duration-300">
                    <i data-lucide="coffee" class="hidden w-6 h-6 md:w-7 md:h-7 text-stone-900"></i>
                </button>
                <h2 class="text-xl md:text-2xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-white via-stone-200 to-white animate-shimmer hidden sm:block whitespace-nowrap drop-shadow">QUADLINK CAFE INVENTORY</h2>
            </div>
            
            <div class="flex items-center gap-2 px-4 py-2 glass-panel rounded-full text-xs md:text-sm font-bold text-white bg-white/10 shadow">
                <i data-lucide="calendar" class="w-3 h-3 md:w-4 md:h-4 text-stone-200"></i>
                <span id="current-date"></span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 py-6 md:py-8 w-full space-y-6 md:space-y-8 flex-grow pb-24">
            
            <!-- Navigation Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
                <!-- In House Tab -->
                <button onclick="switchTab('in-house')" id="tab-in-house" class="glass-card active p-5 md:p-6 rounded-2xl md:rounded-3xl text-left flex flex-col cursor-pointer group">
                    <div class="flex justify-between items-start mb-4 md:mb-6 w-full">
                        <div class="icon-container p-3 rounded-xl md:rounded-2xl bg-white/25 text-white shadow transition-all duration-300">
                            <i data-lucide="coffee" class="logo-icon w-6 h-6 md:w-7 md:h-7"></i>
                        </div>
                        <span id="count-in-house" class="text-[11px] md:text-xs font-extrabold px-2.5 py-1 rounded-full bg-stone-900/60 text-white backdrop-blur-md border border-white/20 shadow-sm transition-all duration-300">0 Items</span>
                    </div>
                    <h3 class="text-lg md:text-xl font-extrabold tracking-tight text-white drop-shadow-sm transition-colors duration-300">In House</h3>
                    <p class="mt-1 md:mt-2 text-xs md:text-sm text-stone-200 font-semibold transition-colors duration-300">Daily active stock.</p>
                </button>

                <!-- Storage Tab -->
                <button onclick="switchTab('storage')" id="tab-storage" class="glass-card p-5 md:p-6 rounded-2xl md:rounded-3xl text-left flex flex-col cursor-pointer group">
                    <div class="flex justify-between items-start mb-4 md:mb-6 w-full">
                        <div class="icon-container p-3 rounded-xl md:rounded-2xl bg-white/25 text-white shadow transition-all duration-300">
                            <i data-lucide="package" class="logo-icon w-6 h-6 md:w-7 md:h-7"></i>
                        </div>
                        <span id="count-storage" class="text-[11px] md:text-xs font-extrabold px-2.5 py-1 rounded-full bg-stone-900/60 text-white backdrop-blur-md border border-white/20 shadow-sm transition-all duration-300">0 Items</span>
                    </div>
                    <h3 class="text-lg md:text-xl font-extrabold tracking-tight text-white drop-shadow-sm transition-colors duration-300">Storage</h3>
                    <p class="mt-1 md:mt-2 text-xs md:text-sm text-stone-200 font-semibold transition-colors duration-300">Track bulk supplies.</p>
                </button>

                <!-- Marked Out Tab -->
                <button onclick="switchTab('marked-out')" id="tab-marked-out" class="glass-card p-5 md:p-6 rounded-2xl md:rounded-3xl text-left flex flex-col cursor-pointer group sm:col-span-2 md:col-span-1">
                    <div class="flex justify-between items-start mb-4 md:mb-6 w-full">
                        <div class="icon-container p-3 rounded-xl md:rounded-2xl bg-white/25 text-white shadow transition-all duration-300">
                            <i data-lucide="archive-x" class="logo-icon w-6 h-6 md:w-7 md:h-7"></i>
                        </div>
                        <span id="count-marked-out" class="text-[11px] md:text-xs font-extrabold px-2.5 py-1 rounded-full bg-stone-900/60 text-white backdrop-blur-md border border-white/20 shadow-sm transition-all duration-300">0 Items</span>
                    </div>
                    <h3 class="text-lg md:text-xl font-extrabold tracking-tight text-white drop-shadow-sm transition-colors duration-300">Marked Out</h3>
                    <p class="mt-1 md:mt-2 text-xs md:text-sm text-stone-200 font-semibold transition-colors duration-300">Review waste & damage.</p>
                </button>
            </div>

            <!-- Action Bar -->
            <div class="glass-panel p-3 md:p-4 rounded-xl md:rounded-2xl flex flex-col lg:flex-row justify-between items-center gap-3 md:gap-4 fade-in">
                <div class="flex items-center gap-2 md:gap-3 w-full lg:w-auto flex-wrap">
                    <button onclick="deleteSelected()" id="btn-delete" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 md:px-4 py-2 md:py-2.5 bg-red-600/90 hover:bg-red-600 text-white rounded-lg md:rounded-xl font-bold text-xs md:text-sm disabled:opacity-40 disabled:cursor-not-allowed shadow-lg transition-all duration-300 hover:scale-105 active:scale-95" disabled>
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                        <span class="hidden md:inline">Delete Selected</span>
                        <span class="md:hidden">Delete</span>
                        <span id="selected-count" class="bg-white text-red-700 text-[10px] md:text-xs px-1.5 md:px-2 py-0.5 rounded-full font-extrabold hidden">0</span>
                    </button>
                    <button onclick="clearHistory()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 md:px-4 py-2 md:py-2.5 bg-white/15 hover:bg-white/25 text-white border border-white/30 rounded-lg md:rounded-xl font-bold text-xs md:text-sm shadow transition-all duration-300 hover:scale-105 active:scale-95">
                        <i data-lucide="history" class="w-4 h-4"></i>
                        <span class="hidden md:inline">Clear History</span>
                        <span class="md:hidden">Clear</span>
                    </button>
                    
                    <!-- Manage Categories Button -->
                    <button onclick="openCategoryModal()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 md:px-4 py-2 md:py-2.5 bg-stone-700/80 hover:bg-stone-600/90 text-white border border-white/30 rounded-lg md:rounded-xl font-bold text-xs md:text-sm shadow-lg transition-all duration-300 hover:scale-105 active:scale-95">
                        <i data-lucide="tags" class="w-4 h-4"></i>
                        <span>Categories</span>
                    </button>

                    <!-- Save DB Button -->
                    <button onclick="saveDatabaseFile()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 md:px-4 py-2 md:py-2.5 bg-indigo-600/90 hover:bg-indigo-600 text-white rounded-lg md:rounded-xl font-bold text-xs md:text-sm shadow-lg transition-all duration-300 hover:scale-105 active:scale-95">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span class="hidden md:inline">Save DB</span>
                        <span class="md:hidden">Save DB</span>
                    </button>
                    
                    <!-- Load DB Button -->
                    <button onclick="triggerLoadFile()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 md:px-4 py-2 md:py-2.5 bg-amber-600/90 hover:bg-amber-600 text-white rounded-lg md:rounded-xl font-bold text-xs md:text-sm shadow-lg transition-all duration-300 hover:scale-105 active:scale-95">
                        <i data-lucide="upload" class="w-4 h-4"></i>
                        <span class="hidden md:inline">Load DB</span>
                        <span class="md:hidden">Load DB</span>
                    </button>
                    <input type="file" id="file-load-input" accept=".json" class="hidden" onchange="loadDatabaseFile(event)">

                    <button onclick="exportToExcel()" class="flex-1 sm:flex-none flex items-center justify-center gap-2 px-3 md:px-4 py-2 md:py-2.5 bg-emerald-600/90 hover:bg-emerald-600 text-white rounded-lg md:rounded-xl font-bold text-xs md:text-sm shadow-lg transition-all duration-300 hover:scale-105 active:scale-95">
                        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
                        <span class="hidden md:inline">Export to Excel</span>
                        <span class="md:hidden">Export</span>
                    </button>
                </div>
                
                <button onclick="openAddModal()" class="w-full lg:w-auto flex items-center justify-center gap-2 bg-white hover:bg-stone-100 text-stone-900 px-6 py-3 md:py-2.5 rounded-xl font-extrabold text-sm whitespace-nowrap shadow-xl transition-all duration-300 hover:scale-105 active:scale-95">
                    <i data-lucide="plus" class="w-4 h-4 md:w-5 md:h-5 text-stone-900"></i>
                    <span id="add-btn-text">Add Item</span>
                </button>
            </div>

            <!-- Dynamic Table Section -->
            <section class="glass-panel rounded-2xl md:rounded-3xl overflow-hidden fade-in shadow-2xl flex flex-col bg-stone-900/40">
                <!-- Table Toolbar -->
                <div class="p-4 md:p-5 border-b border-white/20 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                    <h2 id="section-title" class="text-lg md:text-xl font-extrabold text-white tracking-tight drop-shadow-sm">In House Inventory</h2>
                    <div class="relative w-full sm:w-auto">
                        <i data-lucide="search" class="absolute left-3 top-1/2 transform -translate-y-1/2 text-stone-300 w-4 h-4"></i>
                        <input type="text" id="search-input" onkeyup="renderTable()" placeholder="Search items..." class="w-full sm:w-56 md:w-64 pl-9 pr-4 py-2 bg-black/40 border border-white/30 rounded-full text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-white/60 text-white placeholder-stone-300 shadow-inner transition-all duration-300">
                    </div>
                </div>
                
                <!-- Table Content -->
                <div class="overflow-x-auto w-full transition-all duration-300 min-h-[300px]" id="table-container">
                    <table class="w-full text-left border-collapse min-w-[700px]">
                        <thead class="bg-black/50 border-b border-white/20" id="table-head">
                            <!-- Dynamically populated -->
                        </thead>
                        <tbody class="divide-y divide-white/10" id="table-body">
                            <!-- Dynamically populated -->
                        </tbody>
                    </table>
                    
                    <!-- Empty State -->
                    <div id="empty-state" class="hidden flex-col items-center justify-center py-16 md:py-24 text-stone-300">
                        <i data-lucide="inbox" class="w-12 h-12 md:w-16 md:h-16 mb-3 md:mb-4 opacity-60 text-white"></i>
                        <p class="font-extrabold text-base md:text-lg text-white">No items found</p>
                        <p class="text-xs md:text-sm mt-1 text-stone-200 font-semibold">Click 'Add Item' to populate this section.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- ==================== ADD / EDIT ITEM MODAL ==================== -->
    <div id="add-modal" class="fixed inset-0 z-[60] bg-black/70 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] flex items-center justify-center p-4">
        <div class="glass-panel bg-stone-900/90 rounded-3xl shadow-2xl w-full max-w-md p-6 md:p-8 transform translate-y-8 transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] scale-95 border border-white/30" id="add-modal-content">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-extrabold text-white" id="modal-title">Add Item</h3>
                <button onclick="closeAddModal()" class="text-stone-300 hover:text-white transition-all duration-300 ease-out hover:scale-125 hover:rotate-90 origin-center p-2 rounded-full hover:bg-white/10">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <form id="add-form" onsubmit="handleSaveItem(event)" class="space-y-4 md:space-y-5">
                <div>
                    <label class="block text-xs md:text-sm font-bold text-stone-200 mb-1.5">Item Name</label>
                    <input type="text" id="input-name" required placeholder="e.g. Espresso Beans" class="w-full px-4 py-2.5 bg-white text-stone-900 rounded-xl text-sm font-bold shadow-inner placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-stone-300">
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <div class="flex items-center justify-between mb-1.5">
                            <label id="label-category" class="block text-xs md:text-sm font-bold text-stone-200">Category</label>
                            <button type="button" onclick="openCategoryModal()" class="inline-flex items-center gap-1 px-2 py-0.5 bg-white/15 hover:bg-white/30 text-white rounded-md text-[11px] font-bold border border-white/25 transition-all duration-200 hover:scale-105 active:scale-95" title="Add, Edit, or Delete Categories">
                                <i data-lucide="plus" class="w-3 h-3"></i> Manage
                            </button>
                        </div>
                        <div class="relative">
                            <select id="input-category" required class="w-full px-4 py-2.5 bg-white text-stone-900 rounded-xl text-sm font-bold shadow-inner appearance-none cursor-pointer focus:outline-none focus:ring-2 focus:ring-stone-300 pr-9">
                                <!-- Dynamically populated -->
                            </select>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-stone-600 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs md:text-sm font-bold text-stone-200 mb-1.5">Date Added</label>
                        <input type="date" id="input-date" required class="w-full px-4 py-2.5 bg-white text-stone-900 rounded-xl text-sm font-bold shadow-inner focus:outline-none focus:ring-2 focus:ring-stone-300">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs md:text-sm font-bold text-stone-200 mb-1.5">Quantity</label>
                        <input type="number" step="0.01" id="input-quantity" required placeholder="0" class="w-full px-4 py-2.5 bg-white text-stone-900 rounded-xl text-sm font-bold shadow-inner focus:outline-none focus:ring-2 focus:ring-stone-300">
                    </div>
                    <div>
                        <label class="block text-xs md:text-sm font-bold text-stone-200 mb-1.5">Unit</label>
                        <div class="relative">
                            <select id="input-unit" required class="w-full px-4 py-2.5 bg-white text-stone-900 rounded-xl text-sm font-bold shadow-inner appearance-none cursor-pointer focus:outline-none focus:ring-2 focus:ring-stone-300 pr-9">
                                <option value="" disabled selected>Select...</option>
                                <option value="KG">KG</option>
                                <option value="PACKS">PACKS</option>
                                <option value="PCS">PCS</option>
                                <option value="ML">ML</option>
                                <option value="L">L</option>
                                <option value="BOTTLES">BOTTLES</option>
                                <option value="BOXES">BOXES</option>
                                <option value="Etc.">Etc.</option>
                            </select>
                            <i data-lucide="chevron-down" class="w-4 h-4 text-stone-600 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
                        </div>
                    </div>
                </div>
                
                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closeAddModal()" class="flex-1 px-4 py-3 bg-white/10 border border-white/30 text-white rounded-xl font-bold hover:bg-white/20 transition-all duration-300 text-sm md:text-base">Cancel</button>
                    <button type="submit" id="save-btn-text" class="flex-1 px-4 py-3 bg-white text-stone-900 rounded-xl font-extrabold hover:bg-stone-100 transition-all duration-300 shadow-lg text-sm md:text-base">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================== MANAGE CATEGORIES MODAL ==================== -->
    <div id="category-modal" class="fixed inset-0 z-[75] bg-black/75 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] flex items-center justify-center p-4">
        <div class="glass-panel bg-stone-900/95 rounded-3xl shadow-2xl w-full max-w-md p-6 md:p-8 transform translate-y-8 transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] scale-95 border border-white/30 flex flex-col max-h-[85vh]" id="category-modal-content">
            <div class="flex justify-between items-center mb-5">
                <div class="flex items-center gap-2.5">
                    <div class="p-2 bg-white/15 rounded-xl border border-white/20">
                        <i data-lucide="tags" class="w-5 h-5 text-white"></i>
                    </div>
                    <h3 class="text-xl font-extrabold text-white">Manage Categories</h3>
                </div>
                <button onclick="closeCategoryModal()" class="text-stone-300 hover:text-white transition-all duration-300 ease-out hover:scale-125 hover:rotate-90 origin-center p-2 rounded-full hover:bg-white/10">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Add New Category Form -->
            <form onsubmit="handleAddCategory(event)" class="flex gap-2 mb-5">
                <input type="text" id="new-category-input" placeholder="New category name..." class="flex-1 px-4 py-2.5 bg-white text-stone-900 rounded-xl text-sm font-bold shadow-inner placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-stone-300">
                <button type="submit" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl font-extrabold text-sm shadow-lg transition-all duration-200 hover:scale-105 active:scale-95 flex items-center gap-1.5 whitespace-nowrap">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add
                </button>
            </form>

            <!-- Category List Header -->
            <div class="flex justify-between items-center text-xs font-bold text-stone-300 uppercase tracking-wider px-2 pb-2 border-b border-white/15">
                <span>Category Name</span>
                <span>Actions</span>
            </div>

            <!-- Scrollable Categories List -->
            <div id="category-list-container" class="overflow-y-auto flex-1 divide-y divide-white/10 pr-1 my-1 min-h-[180px] max-h-[340px]">
                <!-- Dynamically populated -->
            </div>

            <div class="pt-4 mt-2 border-t border-white/15 flex justify-end">
                <button type="button" onclick="closeCategoryModal()" class="w-full px-4 py-2.5 bg-white text-stone-900 rounded-xl font-extrabold hover:bg-stone-100 transition-all duration-300 shadow-lg text-sm">Done</button>
            </div>
        </div>
    </div>

    <!-- ==================== CONFIRM MODAL ==================== -->
    <div id="confirm-modal" class="fixed inset-0 z-[90] bg-black/75 backdrop-blur-md opacity-0 pointer-events-none transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] flex items-center justify-center p-4">
        <div class="glass-panel bg-stone-900/95 rounded-3xl shadow-2xl w-full max-w-sm p-6 md:p-8 transform translate-y-8 transition-all duration-400 ease-[cubic-bezier(0.16,1,0.3,1)] scale-95 border border-white/30" id="confirm-modal-content">
            <h3 class="text-xl font-extrabold text-white mb-2">Confirm Action</h3>
            <p id="confirm-message" class="text-stone-200 text-sm mb-6 font-semibold">Are you sure?</p>
            <div class="flex gap-3">
                <button onclick="closeConfirmModal()" class="flex-1 px-4 py-3 bg-white/10 border border-white/30 text-white rounded-xl font-bold hover:bg-white/20 transition-all duration-300 text-sm">Cancel</button>
                <button id="confirm-action-btn" class="flex-1 px-4 py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-500 transition-all duration-300 shadow-lg text-sm">Confirm</button>
            </div>
        </div>
    </div>

    <!-- ==================== JAVASCRIPT LOGIC ==================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global ESC key event listener (prioritizes topmost active modal)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const confirmModal = document.getElementById('confirm-modal');
                const categoryModal = document.getElementById('category-modal');
                const addModal = document.getElementById('add-modal');

                if (confirmModal && !confirmModal.classList.contains('pointer-events-none')) {
                    window.closeConfirmModal();
                } else if (categoryModal && !categoryModal.classList.contains('pointer-events-none')) {
                    window.closeCategoryModal();
                } else if (addModal && !addModal.classList.contains('pointer-events-none')) {
                    window.closeAddModal();
                }
            }
        });

        // Toast notifications
        window.showToast = function(message, type = 'success') {
            const toast = document.getElementById('toast-notification');
            const toastMessage = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMessage.textContent = message;
            if (type === 'success') {
                toastIcon.setAttribute('data-lucide', 'check-circle');
                toastIcon.className = 'w-5 h-5 text-emerald-400';
            } else {
                toastIcon.setAttribute('data-lucide', 'alert-circle');
                toastIcon.className = 'w-5 h-5 text-red-400';
            }
            if (window.lucide) lucide.createIcons();

            toast.classList.remove('translate-y-[-150%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-150%]', 'opacity-0');
            }, 3500);
        }

        // Firebase Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'quadlink-inventory-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

        let auth, db, userId, itemsCollection, categoriesDocRef;
        
        const LOCAL_STORAGE_KEY = 'quadlink_inventory_state';
        const CATEGORIES_STORAGE_KEY = 'quadlink_categories';
        const DEFAULT_CATEGORIES = [
            'Beans',
            'Coffee',
            'Milk',
            'Cups',
            'Syrups',
            'Pastry',
            'Retail',
            'Straw',
            'Packaging',
            'Etc.'
        ];
        
        function loadLocalState() {
            const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (saved) {
                try { return JSON.parse(saved); } catch(e) { console.error(e); }
            }
            return { 'in-house': [], 'storage': [], 'marked-out': [] };
        }

        function loadLocalCategories() {
            const saved = localStorage.getItem(CATEGORIES_STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        return parsed;
                    }
                } catch(e) { console.error(e); }
            }
            return [...DEFAULT_CATEGORIES];
        }

        window.appState = loadLocalState();
        window.categories = loadLocalCategories();
        window.currentTab = 'in-house';
        window.selectedIds = new Set(); 
        window.editingId = null; 
        window.editingCategoryIndex = null;
        
        const generateID = () => 'local_' + crypto.randomUUID();
        const getTodayStr = () => new Date().toISOString().split('T')[0];

        // Escape HTML helper to prevent XSS in custom category names
        function escapeHTML(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        async function persistCategories() {
            localStorage.setItem(CATEGORIES_STORAGE_KEY, JSON.stringify(window.categories));
            window.populateCategoryDropdown();
            window.renderCategoryList();
            if (userId && categoriesDocRef) {
                try {
                    await setDoc(categoriesDocRef, { list: window.categories }, { merge: true });
                } catch (e) {
                    console.error("Error saving categories to Firebase:", e);
                }
            }
        }

        function persistAndRefresh() {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(window.appState));
            window.updateTabCounts();
            window.renderTable();
            if (window.lucide) lucide.createIcons();
        }

        if (firebaseConfig && Object.keys(firebaseConfig).length > 0) {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            initFirebase();
        } else {
            console.warn("No Firebase config detected. Running with LocalStorage persistence.");
        }

        async function initFirebase() {
            try {
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                if (!auth.currentUser) return;
                userId = auth.currentUser.uid;
                
                itemsCollection = collection(db, 'artifacts', appId, 'users', userId, 'inventory_items');
                categoriesDocRef = doc(db, 'artifacts', appId, 'users', userId, 'settings', 'categories');

                onSnapshot(categoriesDocRef, (docSnap) => {
                    if (docSnap.exists() && Array.isArray(docSnap.data().list) && docSnap.data().list.length > 0) {
                        window.categories = docSnap.data().list;
                        localStorage.setItem(CATEGORIES_STORAGE_KEY, JSON.stringify(window.categories));
                        window.populateCategoryDropdown();
                        window.renderCategoryList();
                    }
                }, (error) => {
                    console.error("Firestore categories sync error:", error);
                });

                onSnapshot(itemsCollection, (snapshot) => {
                    const newData = { 'in-house': [], 'storage': [], 'marked-out': [] };
                    
                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        if (newData[data.tab]) {
                            newData[data.tab].push({ _id: docSnap.id, ...data });
                        }
                    });

                    for (let key in newData) {
                        newData[key].sort((a, b) => new Date(b.date) - new Date(a.date));
                    }

                    window.appState = newData;
                    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(window.appState));
                    window.updateTabCounts();
                    window.renderTable();
                }, (error) => {
                    console.error("Firestore sync error:", error);
                });
            } catch (e) {
                console.error("Firebase auth/init error:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-US', options);
            document.getElementById('input-date').value = getTodayStr();

            window.populateCategoryDropdown();
            window.updateTabCounts();
            window.renderTable();
            if (window.lucide) lucide.createIcons();
        });

        // ==================== CATEGORY MANAGEMENT LOGIC ====================
        window.populateCategoryDropdown = function(preserveValue = null) {
            const select = document.getElementById('input-category');
            if (!select) return;
            const currentVal = preserveValue !== null ? preserveValue : select.value;

            let html = '<option value="" disabled ' + (!currentVal ? 'selected' : '') + '>Select...</option>';
            window.categories.forEach(cat => {
                const isSelected = currentVal === cat ? 'selected' : '';
                html += `<option value="${escapeHTML(cat)}" ${isSelected}>${escapeHTML(cat)}</option>`;
            });

            // If an item being edited has a legacy/deleted category not in the current list, keep it selectable
            if (currentVal && !window.categories.includes(currentVal)) {
                html += `<option value="${escapeHTML(currentVal)}" selected>${escapeHTML(currentVal)}</option>`;
            }

            select.innerHTML = html;
        };

        window.openCategoryModal = function() {
            window.editingCategoryIndex = null;
            document.getElementById('new-category-input').value = '';
            window.renderCategoryList();

            const modal = document.getElementById('category-modal');
            const content = document.getElementById('category-modal-content');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('translate-y-8', 'scale-95');
            content.classList.add('translate-y-0', 'scale-100');
            if (window.lucide) lucide.createIcons();
        };

        window.closeCategoryModal = function() {
            const modal = document.getElementById('category-modal');
            const content = document.getElementById('category-modal-content');
            content.classList.remove('translate-y-0', 'scale-100');
            content.classList.add('translate-y-8', 'scale-95');
            setTimeout(() => {
                modal.classList.add('opacity-0', 'pointer-events-none');
                window.editingCategoryIndex = null;
            }, 300);
        };

        window.renderCategoryList = function() {
            const container = document.getElementById('category-list-container');
            if (!container) return;

            if (window.categories.length === 0) {
                container.innerHTML = `
                    <div class="py-10 text-center text-stone-400 text-sm font-semibold">
                        No categories available. Add one above!
                    </div>
                `;
                return;
            }

            let html = '';
            window.categories.forEach((cat, index) => {
                // Count how many items across all tabs use this category
                let usageCount = 0;
                ['in-house', 'storage', 'marked-out'].forEach(tab => {
                    usageCount += window.appState[tab].filter(item => item.category === cat).length;
                });

                if (window.editingCategoryIndex === index) {
                    html += `
                        <div class="py-2.5 px-2 flex items-center gap-2 bg-white/10 rounded-xl my-1">
                            <input type="text" id="edit-cat-input-${index}" value="${escapeHTML(cat)}" 
                                onkeydown="if(event.key==='Enter'){event.preventDefault(); saveEditedCategory(${index});} else if(event.key==='Escape'){event.stopPropagation(); cancelEditCategory();}"
                                class="flex-1 px-3 py-1.5 bg-white text-stone-900 rounded-lg text-sm font-bold focus:outline-none focus:ring-2 focus:ring-emerald-400">
                            <button type="button" onclick="saveEditedCategory(${index})" class="p-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition-all" title="Save">
                                <i data-lucide="check" class="w-4 h-4"></i>
                            </button>
                            <button type="button" onclick="cancelEditCategory()" class="p-1.5 bg-white/15 hover:bg-white/25 text-white rounded-lg transition-all" title="Cancel">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="py-2.5 px-2 flex items-center justify-between hover:bg-white/10 rounded-xl transition-colors group">
                            <div class="flex items-center gap-2.5 min-w-0 pr-2">
                                <span class="text-sm font-bold text-white truncate">${escapeHTML(cat)}</span>
                                <span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-black/40 text-stone-300 border border-white/15 shrink-0">${usageCount}</span>
                            </div>
                            <div class="flex items-center gap-1.5 shrink-0">
                                <button type="button" onclick="startEditCategory(${index})" class="p-1.5 bg-white/15 hover:bg-white/30 text-white rounded-lg transition-all border border-white/20" title="Rename Category">
                                    <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                                </button>
                                <button type="button" onclick="deleteCategory(${index})" class="p-1.5 bg-red-600/80 hover:bg-red-600 text-white rounded-lg transition-all border border-red-400/30" title="Delete Category">
                                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                </button>
                            </div>
                        </div>
                    `;
                }
            });

            container.innerHTML = html;
            if (window.lucide) lucide.createIcons();

            if (window.editingCategoryIndex !== null) {
                const editInput = document.getElementById(`edit-cat-input-${window.editingCategoryIndex}`);
                if (editInput) {
                    editInput.focus();
                    editInput.select();
                }
            }
        };

        window.handleAddCategory = async function(event) {
            event.preventDefault();
            const input = document.getElementById('new-category-input');
            const rawName = input.value.trim();

            if (!rawName) {
                showToast('Category name cannot be empty.', 'error');
                return;
            }

            const exists = window.categories.some(c => c.toLowerCase() === rawName.toLowerCase());
            if (exists) {
                showToast(`"${rawName}" already exists.`, 'error');
                return;
            }

            window.categories.push(rawName);
            input.value = '';
            await persistCategories();
            
            // Select the newly added category in the Add/Edit modal dropdown if it is currently open
            const addModal = document.getElementById('add-modal');
            if (addModal && !addModal.classList.contains('pointer-events-none')) {
                window.populateCategoryDropdown(rawName);
            }

            showToast(`Category "${rawName}" added!`, 'success');
        };

        window.startEditCategory = function(index) {
            window.editingCategoryIndex = index;
            window.renderCategoryList();
        };

        window.cancelEditCategory = function() {
            window.editingCategoryIndex = null;
            window.renderCategoryList();
        };

        window.saveEditedCategory = async function(index) {
            const input = document.getElementById(`edit-cat-input-${index}`);
            if (!input) return;

            const oldName = window.categories[index];
            const newName = input.value.trim();

            if (!newName) {
                showToast('Category name cannot be empty.', 'error');
                return;
            }

            if (oldName === newName) {
                window.editingCategoryIndex = null;
                window.renderCategoryList();
                return;
            }

            const duplicate = window.categories.some((c, i) => i !== index && c.toLowerCase() === newName.toLowerCase());
            if (duplicate) {
                showToast(`Category "${newName}" already exists.`, 'error');
                return;
            }

            // 1. Update category list
            window.categories[index] = newName;
            window.editingCategoryIndex = null;

            // 2. Update all existing inventory items across all tabs that used oldName
            const selectEl = document.getElementById('input-category');
            const prevSelected = selectEl && selectEl.value === oldName ? newName : null;

            let updatedItemsCount = 0;
            const tabs = ['in-house', 'storage', 'marked-out'];
            let batch = (userId && itemsCollection) ? writeBatch(db) : null;

            tabs.forEach(tab => {
                window.appState[tab].forEach(item => {
                    if (item.category === oldName) {
                        item.category = newName;
                        updatedItemsCount++;
                        if (batch && !item._id.startsWith('local_')) {
                            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'inventory_items', item._id);
                            batch.set(docRef, { category: newName }, { merge: true });
                        }
                    }
                });
            });

            if (batch && updatedItemsCount > 0) {
                try {
                    await batch.commit();
                } catch (e) {
                    console.error("Error batch updating item categories in Firebase:", e);
                }
            }

            await persistCategories();
            if (prevSelected) {
                window.populateCategoryDropdown(prevSelected);
            }
            persistAndRefresh();

            const msg = updatedItemsCount > 0 
                ? `Renamed to "${newName}" & updated ${updatedItemsCount} item(s).`
                : `Renamed category to "${newName}".`;
            showToast(msg, 'success');
        };

        window.deleteCategory = function(index) {
            const catName = window.categories[index];
            let usageCount = 0;
            ['in-house', 'storage', 'marked-out'].forEach(tab => {
                usageCount += window.appState[tab].filter(item => item.category === catName).length;
            });

            const warningMsg = usageCount > 0
                ? `Category "${catName}" is currently used by ${usageCount} item(s). Deleting it will remove it from the dropdown list (existing items will keep their current label until edited). Delete anyway?`
                : `Delete category "${catName}"?`;

            window.showConfirmModal(warningMsg, async () => {
                window.categories.splice(index, 1);
                if (window.editingCategoryIndex === index) {
                    window.editingCategoryIndex = null;
                }
                await persistCategories();
                showToast(`Category "${catName}" deleted.`, 'success');
            });
        };

        // ==================== NAVIGATION & UI ====================
        window.proceedToHome = function() {
            const landingPage = document.getElementById('landing-page');
            const homePage = document.getElementById('home-page');
            landingPage.style.opacity = '0';
            landingPage.style.pointerEvents = 'none';
            setTimeout(() => {
                landingPage.style.display = 'none';
                homePage.classList.remove('opacity-0', 'pointer-events-none');
                homePage.classList.add('opacity-100');
            }, 600);
        }

        window.returnToLanding = function() {
            const landingPage = document.getElementById('landing-page');
            const homePage = document.getElementById('home-page');
            homePage.classList.remove('opacity-100');
            homePage.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                landingPage.style.display = 'flex';
                landingPage.style.opacity = '1';
                landingPage.style.pointerEvents = 'auto';
            }, 600);
        }

        window.switchTab = function(tabId) {
            if (window.currentTab === tabId) return;
            window.currentTab = tabId;
            window.selectedIds.clear(); 
            window.updateDeleteButtonState();
            document.getElementById('search-input').value = '';
            
            const tabs = ['in-house', 'storage', 'marked-out'];
            tabs.forEach(t => {
                const card = document.getElementById(`tab-${t}`);
                if (t === tabId) card.classList.add('active');
                else card.classList.remove('active');
            });

            const tableContainer = document.getElementById('table-container');
            tableContainer.style.opacity = '0';
            
            setTimeout(() => {
                window.renderTable();
                tableContainer.style.opacity = '1';
            }, 250);
        }

        window.updateTabCounts = function() {
            document.getElementById('count-in-house').textContent = `${window.appState['in-house'].length} Items`;
            document.getElementById('count-storage').textContent = `${window.appState['storage'].length} Items`;
            document.getElementById('count-marked-out').textContent = `${window.appState['marked-out'].length} Items`;
        }

        window.renderTable = function() {
            const searchQ = document.getElementById('search-input').value.toLowerCase();
            const rawData = window.appState[window.currentTab];
            
            const data = rawData.filter(item => 
                item.name.toLowerCase().includes(searchQ) || 
                item.category.toLowerCase().includes(searchQ)
            );
            
            const titles = {
                'in-house': 'In House Inventory',
                'storage': 'Storage Inventory',
                'marked-out': 'Marked Out Items'
            };
            document.getElementById('section-title').textContent = titles[window.currentTab];
            
            const tableHead = document.getElementById('table-head');
            const tableBody = document.getElementById('table-body');
            const emptyState = document.getElementById('empty-state');
            const tableElement = document.querySelector('table');

            if (data.length === 0) {
                tableElement.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
            } else {
                tableElement.classList.remove('hidden');
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');

                const allSelected = data.length > 0 && data.every(item => window.selectedIds.has(item._id));

                tableHead.innerHTML = `
                    <tr>
                        <th class="px-4 md:px-6 py-4 w-12">
                            <input type="checkbox" class="custom-checkbox" onchange="toggleSelectAll(this, ${JSON.stringify(data.map(d=>d._id)).replace(/"/g, "'")})" ${allSelected ? 'checked' : ''}>
                        </th>
                        <th class="px-4 md:px-6 py-4 text-xs md:text-sm uppercase tracking-widest text-stone-200 font-extrabold whitespace-nowrap">Item Name</th>
                        <th class="px-4 md:px-6 py-4 text-xs md:text-sm uppercase tracking-widest text-stone-200 font-extrabold whitespace-nowrap">Category</th>
                        <th class="px-4 md:px-6 py-4 text-xs md:text-sm uppercase tracking-widest text-stone-200 font-extrabold whitespace-nowrap">Quantity</th>
                        <th class="px-4 md:px-6 py-4 text-xs md:text-sm uppercase tracking-widest text-stone-200 font-extrabold whitespace-nowrap">Unit</th>
                        <th class="px-4 md:px-6 py-4 text-xs md:text-sm uppercase tracking-widest text-stone-200 font-extrabold whitespace-nowrap">Date</th>
                        <th class="px-4 md:px-6 py-4 text-xs md:text-sm uppercase tracking-widest text-stone-200 font-extrabold text-right whitespace-nowrap">Actions</th>
                    </tr>
                `;

                let bodyHTML = '';
                data.forEach((row, index) => {
                    const isChecked = window.selectedIds.has(row._id);
                    const delay = Math.min(index * 0.03, 0.35);
                    bodyHTML += `
                        <tr class="row-animate hover:bg-white/15 transition-all duration-300 ${isChecked ? 'bg-white/25' : ''}" style="animation-delay: ${delay}s">
                            <td class="px-4 md:px-6 py-4">
                                <input type="checkbox" class="custom-checkbox row-checkbox" value="${row._id}" onchange="toggleSelectRow('${row._id}')" ${isChecked ? 'checked' : ''}>
                            </td>
                            <td class="px-4 md:px-6 py-4 text-sm font-bold text-white whitespace-nowrap drop-shadow-sm">${escapeHTML(row.name)}</td>
                            <td class="px-4 md:px-6 py-4 text-sm font-semibold text-stone-200 whitespace-nowrap">
                                <span class="bg-black/40 px-2.5 py-1 rounded-md border border-white/20 shadow-sm">${escapeHTML(row.category)}</span>
                            </td>
                            <td class="px-4 md:px-6 py-4 text-sm font-extrabold text-white whitespace-nowrap">${row.quantity}</td>
                            <td class="px-4 md:px-6 py-4 text-sm font-bold text-stone-200 whitespace-nowrap">${escapeHTML(row.unit)}</td>
                            <td class="px-4 md:px-6 py-4 text-sm font-semibold text-stone-200 whitespace-nowrap">${escapeHTML(row.date)}</td>
                            <td class="px-4 md:px-6 py-4 text-sm text-right whitespace-nowrap">
                                <button onclick="openEditModal('${row._id}')" class="px-3.5 py-1.5 bg-white/20 hover:bg-white/30 text-white rounded-lg text-xs font-bold transition-all duration-300 inline-flex items-center gap-1.5 border border-white/30 shadow hover:scale-105 active:scale-95">
                                    <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Edit
                                </button>
                            </td>
                        </tr>
                    `;
                });
                tableBody.innerHTML = bodyHTML;
            }
            if (window.lucide) lucide.createIcons();
            window.updateTabCounts();
        }

        window.toggleSelectAll = function(checkbox, currentDataIdsStr) {
            const currentDataIds = JSON.parse(currentDataIdsStr.replace(/'/g, '"'));
            if (checkbox.checked) {
                currentDataIds.forEach(id => window.selectedIds.add(id));
            } else {
                currentDataIds.forEach(id => window.selectedIds.delete(id));
            }
            window.renderTable(); 
            window.updateDeleteButtonState();
        }

        window.toggleSelectRow = function(id) {
            if (window.selectedIds.has(id)) window.selectedIds.delete(id);
            else window.selectedIds.add(id);
            
            window.updateDeleteButtonState();
            
            const rowCheckboxes = document.querySelectorAll('.row-checkbox');
            let allChecked = true;
            rowCheckboxes.forEach(cb => {
                const tr = cb.closest('tr');
                if (cb.checked) {
                    tr.classList.add('bg-white/25');
                } else {
                    tr.classList.remove('bg-white/25');
                    allChecked = false;
                }
            });
            const headerCheckbox = document.querySelector('#table-head input[type="checkbox"]');
            if (headerCheckbox) headerCheckbox.checked = allChecked && rowCheckboxes.length > 0;
        }

        window.updateDeleteButtonState = function() {
            const btn = document.getElementById('btn-delete');
            const badge = document.getElementById('selected-count');
            if (window.selectedIds.size > 0) {
                btn.disabled = false;
                badge.textContent = window.selectedIds.size;
                badge.classList.remove('hidden');
            } else {
                btn.disabled = true;
                badge.classList.add('hidden');
            }
        }

        window.showConfirmModal = function(message, onConfirm) {
            document.getElementById('confirm-message').textContent = message;
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            
            const btn = document.getElementById('confirm-action-btn');
            const isDestructive = message.toLowerCase().includes('delete') || message.toLowerCase().includes('clear');
            btn.textContent = isDestructive ? 'Yes, Delete' : 'Confirm Action';
            btn.className = isDestructive 
                ? 'flex-1 px-4 py-3 bg-red-600 text-white rounded-xl font-bold hover:bg-red-500 transition-all duration-300 shadow-lg text-sm'
                : 'flex-1 px-4 py-3 bg-amber-600 text-white rounded-xl font-bold hover:bg-amber-500 transition-all duration-300 shadow-lg text-sm';

            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('translate-y-8', 'scale-95');
            content.classList.add('translate-y-0', 'scale-100');

            btn.onclick = () => {
                onConfirm();
                window.closeConfirmModal();
            };
        }

        window.closeConfirmModal = function() {
            const modal = document.getElementById('confirm-modal');
            const content = document.getElementById('confirm-modal-content');
            content.classList.remove('translate-y-0', 'scale-100');
            content.classList.add('translate-y-8', 'scale-95');
            setTimeout(() => {
                modal.classList.add('opacity-0', 'pointer-events-none');
            }, 300);
        }

        window.deleteSelected = async function() {
            if (window.selectedIds.size === 0) return;
            
            window.showConfirmModal(`Permanently delete ${window.selectedIds.size} selected item(s)?`, async () => {
                if (userId && itemsCollection) {
                    try {
                        const batch = writeBatch(db);
                        window.selectedIds.forEach(id => {
                            if (!id.startsWith('local_')) {
                                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'inventory_items', id);
                                batch.delete(docRef);
                            }
                        });
                        await batch.commit();
                    } catch (e) {
                        console.error("Error deleting from Firebase:", e);
                    }
                }
                
                window.appState[window.currentTab] = window.appState[window.currentTab].filter(item => !window.selectedIds.has(item._id));
                window.selectedIds.clear();
                window.updateDeleteButtonState();
                persistAndRefresh();
                showToast('Selected items deleted.', 'success');
            });
        }

        window.clearHistory = async function() {
            if (window.appState[window.currentTab].length === 0) return;
            
            const tabName = window.currentTab.replace('-', ' ').toUpperCase();
            window.showConfirmModal(`Clear ALL items in ${tabName}? This action cannot be undone.`, async () => {
                if (userId && itemsCollection) {
                    try {
                        const batch = writeBatch(db);
                        window.appState[window.currentTab].forEach(item => {
                            if (!item._id.startsWith('local_')) {
                                const docRef = doc(db, 'artifacts', appId, 'users', userId, 'inventory_items', item._id);
                                batch.delete(docRef);
                            }
                        });
                        await batch.commit();
                    } catch (e) {
                        console.error("Error clearing Firebase collection:", e);
                    }
                }
                
                window.appState[window.currentTab] = [];
                window.selectedIds.clear();
                window.updateDeleteButtonState();
                persistAndRefresh();
                showToast(`Cleared all items in ${tabName}.`, 'success');
            });
        };

        window.saveDatabaseFile = function() {
            const backupPayload = {
                'in-house': window.appState['in-house'],
                'storage': window.appState['storage'],
                'marked-out': window.appState['marked-out'],
                'categories': window.categories
            };
            const dataStr = JSON.stringify(backupPayload, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            const dateStr = new Date().toISOString().split('T')[0];
            a.download = `quadlink_db_backup_${dateStr}.json`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('Database file successfully downloaded!', 'success');
        };

        window.triggerLoadFile = function() {
            document.getElementById('file-load-input').click();
        };

        window.loadDatabaseFile = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    if (importedData['in-house'] && importedData['storage'] && importedData['marked-out']) {
                        window.showConfirmModal("Loading this backup file will overwrite your current screen data. Proceed?", async () => {
                            window.appState = {
                                'in-house': importedData['in-house'],
                                'storage': importedData['storage'],
                                'marked-out': importedData['marked-out']
                            };

                            // Backward-compatible categories restoration
                            if (Array.isArray(importedData['categories']) && importedData['categories'].length > 0) {
                                window.categories = importedData['categories'];
                            } else {
                                // Discover any custom categories present in the imported items
                                const mergedCats = new Set(window.categories);
                                ['in-house', 'storage', 'marked-out'].forEach(tab => {
                                    importedData[tab].forEach(item => {
                                        if (item.category) mergedCats.add(item.category);
                                    });
                                });
                                window.categories = Array.from(mergedCats);
                            }
                            await persistCategories();
                            
                            if (userId && itemsCollection) {
                                try {
                                    const batch = writeBatch(db);
                                    const tabs = ['in-house', 'storage', 'marked-out'];
                                    tabs.forEach(tab => {
                                        importedData[tab].forEach(item => {
                                            const docRef = doc(db, 'artifacts', appId, 'users', userId, 'inventory_items', item._id);
                                            batch.set(docRef, item);
                                        });
                                    });
                                    await batch.commit();
                                } catch (e) {
                                    console.error("Firebase sync error during load:", e);
                                }
                            }

                            persistAndRefresh();
                            document.getElementById('file-load-input').value = '';
                            showToast('Database file successfully loaded!', 'success');
                        });
                    } else {
                        showToast("Invalid backup file format. Missing required tab collections.", 'error');
                    }
                } catch (err) {
                    console.error("Parse error:", err);
                    showToast("Error reading file. Ensure it is a valid JSON backup.", 'error');
                }
            };
            reader.readAsText(file);
        };

        window.openAddModal = function() {
            window.editingId = null;
            document.getElementById('modal-title').textContent = 'Add Item';
            document.getElementById('save-btn-text').textContent = 'Save Item';
            const modal = document.getElementById('add-modal');
            const content = document.getElementById('add-modal-content');
            document.getElementById('add-form').reset();
            window.populateCategoryDropdown('');
            document.getElementById('input-date').value = getTodayStr(); 
            
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('translate-y-8', 'scale-95');
            content.classList.add('translate-y-0', 'scale-100');
            if (window.lucide) lucide.createIcons();
        }

        window.openEditModal = function(id) {
            const item = window.appState[window.currentTab].find(i => i._id === id);
            if (!item) return;

            window.editingId = id;
            document.getElementById('modal-title').textContent = 'Edit Item';
            document.getElementById('save-btn-text').textContent = 'Update Item';
            
            window.populateCategoryDropdown(item.category);
            document.getElementById('input-name').value = item.name;
            document.getElementById('input-category').value = item.category;
            document.getElementById('input-quantity').value = item.quantity;
            document.getElementById('input-unit').value = item.unit;
            document.getElementById('input-date').value = item.date;

            const modal = document.getElementById('add-modal');
            const content = document.getElementById('add-modal-content');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('translate-y-8', 'scale-95');
            content.classList.add('translate-y-0', 'scale-100');
            if (window.lucide) lucide.createIcons();
        }

        window.closeAddModal = function() {
            const modal = document.getElementById('add-modal');
            const content = document.getElementById('add-modal-content');
            content.classList.remove('translate-y-0', 'scale-100');
            content.classList.add('translate-y-8', 'scale-95');
            setTimeout(() => {
                modal.classList.add('opacity-0', 'pointer-events-none');
                window.editingId = null;
            }, 300);
        }

        window.handleSaveItem = async function(event) {
            event.preventDefault();
            const itemData = {
                name: document.getElementById('input-name').value,
                category: document.getElementById('input-category').value,
                quantity: parseFloat(document.getElementById('input-quantity').value) || 0,
                unit: document.getElementById('input-unit').value,
                date: document.getElementById('input-date').value,
                tab: window.currentTab
            };

            if (window.editingId) {
                const index = window.appState[window.currentTab].findIndex(i => i._id === window.editingId);
                if (index !== -1) {
                    window.appState[window.currentTab][index] = { _id: window.editingId, ...itemData };
                }

                if (userId && itemsCollection && !window.editingId.startsWith('local_')) {
                    try {
                        const docRef = doc(db, 'artifacts', appId, 'users', userId, 'inventory_items', window.editingId);
                        await setDoc(docRef, itemData, { merge: true });
                    } catch (e) {
                        console.error("Error updating in Firebase:", e);
                    }
                }
                showToast('Item updated successfully!', 'success');
            } else {
                const newId = generateID();
                const newItem = { _id: newId, ...itemData };
                window.appState[window.currentTab].unshift(newItem);

                if (userId && itemsCollection) {
                    try {
                        const docRef = doc(itemsCollection);
                        await setDoc(docRef, itemData);
                    } catch (e) {
                        console.error("Error adding to Firebase:", e);
                    }
                }
                showToast('Item added to inventory!', 'success');
            }

            window.closeAddModal();
            persistAndRefresh();
        }

        window.exportToExcel = function() {
            // Category Mapping & Custom Display Order
            const categoryMap = {
                'Beans': 'COFFEE BEANS',
                'Coffee': 'COFFEE BEANS',
                'Milk': 'MILK & DAIRY PRODUCTS',
                'Syrups': 'SYRUPS, POWDERS & SWEETENERS',
                'Beverages': 'BOTTLED & CANNED BEVERAGES',
                'Pastry': 'SNACKS & RETAIL',
                'Retail': 'SNACKS & RETAIL',
                'Produce': 'FRESH PRODUCE & PERISHABLES',
                'Cups': 'BAR PACKAGING & CONSUMABLES',
                'Straw': 'BAR PACKAGING & CONSUMABLES',
                'Packaging': 'BAR PACKAGING & CONSUMABLES',
                'Etc.': 'OTHER SUPPLIES & MISCELLANEOUS'
            };

            const categoryOrder = [
                'COFFEE BEANS',
                'MILK & DAIRY PRODUCTS',
                'SYRUPS, POWDERS & SWEETENERS',
                'BOTTLED & CANNED BEVERAGES',
                'SNACKS & RETAIL',
                'FRESH PRODUCE & PERISHABLES',
                'BAR PACKAGING & CONSUMABLES',
                'OTHER SUPPLIES & MISCELLANEOUS'
            ];

            const mergedMap = new Map();

            const processItem = (item, source) => {
                const key = item.name.toLowerCase().trim();
                const rawCat = item.category || 'Etc.';
                const upperCat = rawCat.toUpperCase();
                let mappedGroup = categoryMap[rawCat];
                
                if (!mappedGroup) {
                    if (upperCat.includes('MILK')) {
                        mappedGroup = 'MILK & DAIRY PRODUCTS';
                    } else if (upperCat.includes('RETAIL') || upperCat.includes('SNACK')) {
                        mappedGroup = 'SNACKS & RETAIL';
                    } else {
                        mappedGroup = 'OTHER SUPPLIES & MISCELLANEOUS';
                    }
                }

                if (!mergedMap.has(key)) {
                    mergedMap.set(key, {
                        desc: item.name,
                        unit: item.unit || 'Pcs',
                        categoryGroup: mappedGroup,
                        inHouse: 0,
                        storage: 0
                    });
                }
                const record = mergedMap.get(key);
                if (source === 'in-house') record.inHouse += (parseFloat(item.quantity) || 0);
                if (source === 'storage') record.storage += (parseFloat(item.quantity) || 0);
            };

            window.appState['in-house'].forEach(item => processItem(item, 'in-house'));
            window.appState['storage'].forEach(item => processItem(item, 'storage'));

            const today = new Date();
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            const dateStr = `${monthNames[today.getMonth()]} ${today.getDate()}, ${today.getFullYear()}`;

            const wsData = [
                ["CAFÉ INVENTORY ( QUADLINK )"],
                [`Date: ${dateStr}`],
                ["Organized by product categories with In-House and Storage breakdown"],
                [],
                ["Item Description", "Unit", "In-House Bar", "Back Storage", "Total On-Hand", "Stock Status"]
            ];

            // Group items by categoryGroup
            const groupedData = {};
            mergedMap.forEach(item => {
                if (!groupedData[item.categoryGroup]) {
                    groupedData[item.categoryGroup] = [];
                }
                groupedData[item.categoryGroup].push(item);
            });

            let currentRow = 6; // Excel row numbering starts at row 6 for first data row
            const firstDataRow = 6;

            // Sort and push by category order
            const activeCategories = categoryOrder.filter(cat => groupedData[cat] && groupedData[cat].length > 0);
            
            // Catch any unlisted categories
            Object.keys(groupedData).forEach(cat => {
                if (!activeCategories.includes(cat) && groupedData[cat].length > 0) {
                    activeCategories.push(cat);
                }
            });

            activeCategories.forEach(cat => {
                // Category Header Row
                wsData.push([`  ${cat}`, null, null, null, null, null]);
                currentRow++;

                groupedData[cat].forEach(row => {
                    const cRef = `C${currentRow}`;
                    const dRef = `D${currentRow}`;
                    const eRef = `E${currentRow}`;

                    wsData.push([
                        row.desc,
                        row.unit,
                        row.inHouse,
                        row.storage,
                        { f: `${cRef}+${dRef}` },
                        { f: `IF(${eRef}=0, "OUT OF STOCK", IF(${cRef}=0, "REPLENISH BAR", "OK"))` }
                    ]);
                    currentRow++;
                });
            });

            const lastDataRow = currentRow - 1;

            // Total Summary Row at bottom
            if (lastDataRow >= firstDataRow) {
                wsData.push([
                    "TOTAL ITEMS COUNT",
                    null,
                    { f: `SUM(C${firstDataRow}:C${lastDataRow})` },
                    { f: `SUM(D${firstDataRow}:D${lastDataRow})` },
                    { f: `SUM(E${firstDataRow}:E${lastDataRow})` },
                    null
                ]);
            }

            const ws = XLSX.utils.aoa_to_sheet(wsData);
            ws['!cols'] = [ {wch: 32}, {wch: 12}, {wch: 16}, {wch: 16}, {wch: 16}, {wch: 18} ];

            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Categorized Inventory");

            const formattedDate = `${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}-${String(today.getFullYear()).slice(-2)}`;
            const fileName = `${formattedDate} ( INVENTORY ).xlsx`;

            XLSX.writeFile(wb, fileName);
            showToast('Excel report exported!', 'success');
        }
    </script>
